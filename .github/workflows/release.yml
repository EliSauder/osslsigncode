name: Release

# Build portable, release-grade binaries for every supported architecture on a
# version tag, then attach them (plus a SHA256SUMS.txt for pinning) to the
# GitHub release.
#
#   Linux   -> fully-static musl binaries (zero shared-lib deps), built in
#              Alpine on native amd64 and arm64 runners.
#   macOS   -> arm64 + x86_64, third-party libs (OpenSSL/curl/zlib) linked
#              statically via vcpkg; only system libs remain dynamic.
#   Windows -> x64 static (MSVC static CRT + static deps) -> single self
#              contained .exe.
#
# The Linux artifacts are what a hermetic Bazel `ctx.download` repo rule wants:
# a self-contained binary that runs anywhere, verified with a pinned sha256.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version string to embed in asset names (e.g. 2.15).'
        required: true

env:
  BUILD_TYPE: Release
  OPENSSL_VERSION: "3.5.7"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Linux: fully-static musl binaries. Alpine is the canonical place static
  # linking of OpenSSL + curl + zlib "just works", because musl has no NSS
  # dlopen machinery -- so getaddrinfo() for timestamp/CRL servers still works
  # in a 100% static binary (unlike static glibc).
  # --------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            py_arch: x64
          - arch: arm64
            os: ubuntu-24.04-arm
            py_arch: arm64
    runs-on: ${{ matrix.os }}
    container: alpine:3.20
    env:
      OPENSSL_PREFIX: /opt/openssl-static
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: laverdet/alpine-arm64@v1
        if: matrix.arch == 'arm64'

      - name: Install system packages
        # First step runs before bash exists in the container, so use sh.
        shell: sh
        run: |
          apk add --update --no-cache \
            git bash build-base cmake ninja \
            python3 py3-pip openssl \
            openssl-dev openssl-libs-static \
            curl-dev curl-static wget tar perl \
            zlib-dev zlib-static linux-headers \
            nghttp2-static brotli-static zstd-static \
            libidn2-static c-ares-static libpsl-static libunistring-static
          ln -sf python3 /usr/bin/python

      #- name: Restore cached OpenSSL
      #  id: cache-openssl
      #  uses: actions/cache@v4
      #  with:
      #    path: ${{ env.OPENSSL_PREFIX }}
      #    key: openssl-${{ env.OPENSSL_VERSION }}-nomodule-static-${{ matrix.arch }}-alpine3.20

      - name: Validate Python Setup
        run: |
          pip install --break-system-packages --upgrade 'cryptography>=43,<46'
          python -c "import sys; print(sys.executable)"
          python --version
          python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      #- name: Build OpenSSL (static, no-module, legacy built-in)
      #  if: steps.cache-openssl.outputs.cache-hit != 'true'
      #  shell: sh
      #  run: |
      #    set -eux
      #    cd /tmp
      #    wget -O openssl.tar.gz \
      #      "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
      #    tar xf openssl.tar.gz
      #    cd "openssl-${OPENSSL_VERSION}"
      #    # ./config auto-detects amd64 vs arm64, so it works for both matrix rows.
      #    # no-module => legacy provider is compiled into libcrypto.a (no dlopen).
      #    ./config \
      #      no-shared no-module no-tests enable-legacy \
      #      --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl"
      #    make -j"$(nproc)"
      #    make install_sw   # install_sw skips man pages -> faster

      - uses: actions/checkout@v5

      - name: Resolve version
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Validate Python Setup
        run: |
          python -c "import sys; print(sys.executable)"
          python --version
          python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      - name: Configure
        run: |
          cmake -G 'Unix Makefiles' -S "$GITHUB_WORKSPACE" -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DZLIB_USE_STATIC_LIBS=TRUE \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCURL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_EXE_LINKER_FLAGS="-static -s"
        #-DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \

      - name: Build
        run: cmake --build build

      - name: Verify the binary is fully static
        run: |
          bin="build/osslsigncode"
          file "$bin"
          if ! file "$bin" | grep -q 'statically linked'; then
            echo "::error::binary is not fully static"
            ldd "$bin" || true
            exit 1
          fi

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure -C "$BUILD_TYPE"

      - name: Upload the errors
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        run: |
          asset="osslsigncode-${VERSION}-linux-${{ matrix.arch }}"
          install -Dm755 build/osslsigncode "stage/${asset}/osslsigncode"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          tar -C stage -czf "${asset}.tar.gz" "${asset}"
          sha256sum "${asset}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux-${{ matrix.arch }}
          path: osslsigncode-*-linux-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS: arm64 + x86_64. Third-party deps come from vcpkg static triplets, so
  # the binary depends only on always-present system libraries. (A truly static
  # binary is not possible on macOS -- libSystem must be dynamic.)
  # --------------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-26
            triplet: arm64-osx
            osx_arch: arm64
            py_arch: arm64
          - arch: amd64
            os: macos-26-intel
            triplet: x64-osx
            osx_arch: x86_64
            py_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      ZLIB_VERSION: 1.3.1
      ZLIB_PREFIX: /tmp/zlibinstall
    steps:
      - name: Restore cached ZLib
        id: cache-zlib
        uses: actions/cache@v4
        with:
          path: "${{env.ZLIB_PREFIX}}"
          key: zlib-${{ env.ZLIB_VERSION }}-static-${{ matrix.arch }}-macos

      - name: Build ZLib
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eux
          cd /tmp
          wget -O zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz"
          tar xf zlib.tar.gz
          cd "zlib-${ZLIB_VERSION}"
          # ./config auto-detects amd64 vs arm64, so it works for both matrix rows.
          # no-module => legacy provider is compiled into libcrypto.a (no dlopen).
          CFLAGS="-arch ${{ matrix.osx_arch }}" ./configure --static --prefix="${{env.ZLIB_PREFIX}}"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - uses: actions/checkout@v5

      - name: Resolve version
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install Xcode (macOS)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup the oldest supported version of cmake (macOS)
        uses: jwlawson/actions-setup-cmake@v2.2.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          update-environment: false
          architecture: ${{matrix.py_arch}}

      - name: Set up Python virtual environment
        run: |
          python -m venv --system-site-packages --copies venv

      - name: Install test dependency (cryptography)
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          ARCHFLAGS="-arch ${{ matrix.osx_arch }}" python -m pip install --upgrade cryptography
          python -c "import sys; print(sys.executable)"
          python --version
          python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      - name: Cache vcpkg archives
        uses: actions/cache@v5
        with:
          path: /Users/runner/.cache/vcpkg/archives
          key: release-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: release-${{ matrix.triplet }}-

      - name: Configure
        run: |
          source venv/bin/activate
          cmake -G "Unix Makefiles" -S "${{github.workspace}}" -B "${{github.workspace}}/build" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}" \
            -DZLIB_ROOT="${{env.ZLIB_PREFIX}}" \
            -DZLIB_USE_STATIC_LIBS=TRUE \
            -DOPENSSL_USE_STATIC_LIBS=TRUE

        #-DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
        #-DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \

      - name: Build
        run: |
          cmake --build "${{github.workspace}}/build" --config "$BUILD_TYPE"

      - name: Verify no third-party dylibs are linked
        run: |
          bin="build/osslsigncode"
          otool -L "$bin"
          if otool -L "$bin" | grep -Ei 'vcpkg|Cellar|libssl|libcrypto|libcurl'; then
            echo "::error::binary links a non-system dylib"
            exit 1
          fi
          strip -S "$bin" || true

      - name: Test
        working-directory: build
        run: |
          source ../venv/bin/activate
          ctest --output-on-failure -C "$BUILD_TYPE"

      - name: Upload the errors
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        run: |
          asset="osslsigncode-${VERSION}-macos-${{ matrix.arch }}"
          mkdir -p "stage/${asset}"
          cp build/osslsigncode "stage/${asset}/"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          (cd stage && zip -r "../${asset}.zip" "${asset}")
          shasum -a 256 "${asset}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos-${{ matrix.arch }}
          path: osslsigncode-*-macos-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: x64, MSVC static triplet -> static CRT + static deps -> a single
  # self-contained .exe (no vcredist / no third-party DLLs).
  # --------------------------------------------------------------------------
  windows:
    name: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: windows-11-arm
            triplet: arm64-windows-static
            vs_arch: arm64
            win_arch: arm64
          - arch: amd64
            os: windows-latest
            triplet: x64-windows-static
            vs_arch: amd64
            win_arch: x64
    runs-on: ${{matrix.os}}
    env:
      VCPKG_ROOT: C:/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Configure Visual Studio
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.vs_arch}}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Set up Python virtual environment
        run: |
          python -m venv --system-site-packages --copies venv

      - name: Install test dependency (cryptography)
        run: |
          .\venv\Scripts\Activate.ps1
          python -m ensurepip
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip cryptography
          python.exe -c "import sys; print(sys.executable)"
          python.exe --version
          python.exe -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      - name: Cache vcpkg archives
        uses: actions/cache@v5
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: release-${{matrix.triplet}}-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: release-${{matrix.triplet}}-windows-static-

      - name: Configure
        run: |
          .\venv\Scripts\Activate.ps1
          cmake -G Ninja -S "${{ github.workspace }}" -B build `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_ARCHITECTURE="${{matrix.win_arch}}" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DZLIB_USE_STATIC_LIBS=TRUE `
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        working-directory: build
        run: |
          ..\venv\Scripts\Activate.ps1
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload the errors
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        shell: bash
        run: |
          asset="osslsigncode-${VERSION}-windows-${{matrix.arch}}"
          mkdir -p "stage/${asset}"
          cp build/osslsigncode.exe "stage/${asset}/"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          (cd stage && 7z a -tzip "../${asset}.zip" "${asset}")
          sha256sum "${asset}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows-${{matrix.arch}}
          path: osslsigncode-*-windows-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Publish: collect every artifact, generate SHA256SUMS.txt, attach to release.
  # --------------------------------------------------------------------------
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/modify the release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Create / update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
